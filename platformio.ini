; claude-usage - ESP32 Cheap Yellow Display (ESP32-2432S028R)
; Generated by the cyd-dev MCP server.
;
; TFT_eSPI is configured entirely through build_flags here, so you do NOT have to
; edit User_Setup.h inside the library folder. USER_SETUP_LOADED=1 tells the library
; to skip its own setup headers and trust the flags below.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

build_flags =
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_INVERSION_ON=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DUSE_HSPI_PORT=1

lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	bodmer/TFT_eSPI@^2.5.43
